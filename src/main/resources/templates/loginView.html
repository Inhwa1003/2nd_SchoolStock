<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>모의 투자 시스템</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/Login.css}">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-brand">
            <div class="brand-icon">🏫</div>
            <h1 class="project-name">SchoolStock</h1>
            <p class="brand-subtitle">즐겁게 배우는 나의 첫 모의 투자</p>
        </div>

        <div class="error-msg" th:if="${param.error}">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>

        <form method="post" th:action="@{/schoolstock/login}">
            <div class="login-form">

                <div class="input-group">

                    <div class="input-row">
                        <label for="username">아이디</label>
                        <input id="username"
                               type="text"
                               name="username"
                               placeholder="아이디를 입력하세요" />
                    </div>

                    <div class="input-row">
                        <label for="password">비밀번호</label>
                        <input id="password"
                               type="password"
                               name="password"
                               placeholder="비밀번호를 입력하세요" />
                    </div>

                </div>

                <button type="submit" class="login-button">로그인</button>

            </div>
        </form>

        <div class="join-divider">
            <span>또는</span>
        </div>

        <div class="html-button">
            <a th:href="@{/schoolstock/add-member-view}">회원가입</a>
        </div>

    </div>

</div>

</body>
</html>
