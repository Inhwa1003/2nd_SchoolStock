<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>모의 투자 시스템</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/Login.css}">
</head>
<body>
<div class="login-container">
    <h1 class="project-name">SchoolStock</h1>

    <div class="error-msg" th:if="${param.error}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form method="post" th:action="@{/schoolstock/login}">
        <div class="login-form">
            <div class="input-group">
                <div class="input-row">
                    <label>아이디 :</label> <input type="text" name="username" />
                </div>
                <div class="input-row">
                    <label>비밀번호 :</label> <input type="password" name="password" />
                </div>
            </div>
            <button type="submit" class="login-button">로그인</button>
        </div>
    </form>

    <div class="html-button">
        <a th:href="@{/schoolstock/add-member-view}">회원가입</a>
    </div>
</div>
</body>
</html>
