<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${stockDetail.name} + ' 주식 상세'">주식 상세</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/StockDetail.css}">
    <link rel="stylesheet" th:href="@{/css/Common.css}">
    <link rel="stylesheet" th:href="@{/css/SideBar.css}">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<script th:inline="javascript">
    const stockNo = /*[[${stockDetail.stockNo}]]*/ 0;
</script>

<div class="app">

    <div class="content">

        <header class="hd stock-detail-header">
        </header>

        <section class="stock stock-summary-card">

            <div class="stock-info">
                <div class="stock-title-row">
                    <input id="backBtn"
                           class="back-btn"
                           type="button"
                           value="← 뒤로"/>
                <div class="stock-text-group">
                <h2 th:text="${stockDetail.name}">주식명</h2>
                    <p th:text="${stockDetail.stockContent}">주식 설명</p>
                </div>

            </div>
            </div>

            <div class="stock-price"
                 th:attr="data-prev-price=${stockDetail.prevPoint}, data-stock-no=${stockDetail.stockNo}">

                <div class="price-now"
                     th:text="${stockDetail.nowPoint} + 'P'">
                    0P
                </div>

                <div class="price-change">
                    <span th:if="${stockDetail.priceChange > 0}"
                          class="price-up"
                          th:text="'▲ +' + ${stockDetail.priceChange} + 'P(+' + ${#numbers.formatDecimal(stockDetail.changeRate, 1, 2)} + '%)'">
                        ▲ +0P(+0.00%)
                    </span>

                    <span th:if="${stockDetail.priceChange < 0}"
                          class="price-down"
                          th:text="'▼ ' + ${stockDetail.priceChange} + 'P(' + ${#numbers.formatDecimal(stockDetail.changeRate, 1, 2)} + '%)'">
                        ▼ -0P(-0.00%)
                    </span>

                    <span th:if="${stockDetail.priceChange == 0}"
                          class="price-same">
                        0P(0.00%)
                    </span>
                </div>

                <div class="price-base"
                     th:text="${stockDetail.prevPoint} + 'P'">
                    0P
                </div>
            </div>

        </section>

        <main class="main stock-detail-main">

            <!-- 주문 현황 -->
            <section class="panel order-panel">
                <div class="ptitle panel-title-row">
                    <span>등록된 주문 현황</span>

                    <select id="orderTypeSelect" class="order-type-select">
                        <option value="sell" selected>매도</option>
                        <option value="buy">매수</option>
                    </select>
                </div>

                <div class="order-table-wrap">
                    <table class="table table-hover order-table">
                        <thead>
                        <tr>
                            <th>종류</th>
                            <th>가격(P)</th>
                            <th>수량</th>
                        </tr>
                        </thead>
                        <tbody id="orderListBody">
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 내 주문 -->
            <section class="panel my-order-panel">
                <div class="ptitle panel-title-row">
                    <span>내 요청 주문</span>

                    <input type="button"
                           id="refreshBtn"
                           class="refresh-btn"
                           value="조회"/>
                </div>

                <div class="order-table-wrap">
                    <table class="table table-hover order-table">
                        <thead>
                        <tr>
                            <th>종류</th>
                            <th>가격(P)</th>
                            <th>수량</th>
                            <th>날짜</th>
                            <th>취소</th>
                        </tr>
                        </thead>
                        <tbody id="myOrderListBody">
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- 주문 요청 -->
            <section class="panel request-panel">
                <div class="ptitle request-title">
                    주문 요청하기
                </div>

                <div class="request-card sell-request">
                    <div class="request-card-title sell-title">
                        <span class="request-dot sell-dot"></span>
                        매도 주문
                    </div>

                    <div class="request-input-row">
                        <label for="sellPrice">가격(P)</label>
                        <label for="sellAmount">수량</label>

                        <input id="sellPrice"
                               type="number"
                               min="100"
                               step="100"
                               value="100"/>

                        <input id="sellAmount"
                               type="number"
                               min="1"
                               value="1"/>
                    </div>

                    <button id="sellBtn" class="sell-btn">
                        매도
                    </button>
                </div>

                <div class="request-divider">
                    <span>↔</span>
                </div>

                <div class="request-card buy-request">
                    <div class="request-card-title buy-title">
                        <span class="request-dot buy-dot"></span>
                        매수 주문
                    </div>

                    <div class="request-input-row">
                        <label for="buyPrice">가격(P)</label>
                        <label for="buyAmount">수량</label>

                        <input id="buyPrice"
                               type="number"
                               min="100"
                               step="100"
                               value="100"/>

                        <input id="buyAmount"
                               type="number"
                               min="1"
                               value="1"/>
                    </div>

                    <button id="buyBtn" class="buy-btn">
                        매수
                    </button>
                </div>
            </section>

        </main>
    </div>

    <div th:replace="~{sideBar :: sidebar('stocks')}"></div>
</div>

<script th:src="@{/js/stock-detail.js}" type="text/javascript"></script>

<script th:if="${message != null}" th:inline="javascript">
    alert(/*[[${message}]]*/ '');
</script>

</body>
</html>
