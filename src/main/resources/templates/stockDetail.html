<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${stockName} + ' 주식 상세'">주식 상세</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/StockDetail.css}">


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<script th:inline="javascript">
    const stockNo = /*[[${stockNo}]]*/ 0;
</script>

<div class="app">

    <div class="content">

        <header class="hd">
            <input id="backBtn" class="back-btn" type="button" value="뒤로"/>
            <div class="hd-name">주식 상세정보</div>
        </header>

        <div class="stock">
            <div class="stock-info">
                <h2 th:text="${stockName}">주식명</h2>
                <p th:text="${stockContent}">주식 설명</p>
            </div>

            <div class="stock-price"
                 th:attr="data-prev-price=${prevPrice}, data-stock-no=${stockNo}">
                <div class="price-now" th:text="${nowPrice} + 'P'">0P</div>
                <div class="price-change"></div>
                <div class="price-base" th:text="${prevPrice} + 'P'">0P</div>
            </div>
        </div>

        <div class="main">

            <!-- 주문 현황 -->
            <div class="panel">
                <div class="ptitle">
                    등록된 주문 현황
                    <select id="orderTypeSelect">
                        <option value="sell" selected>매도</option>
                        <option value="buy">매수</option>
                    </select>
                </div>

                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>종류</th>
                        <th>가격(P)</th>
                        <th>수량</th>
                    </tr>
                    </thead>
                    <tbody id="orderListBody">
                    </tbody>
                </table>
            </div>

            <!-- 내 주문 -->
            <div class="panel">
                <div class="ptitle">
                    <span>내 요청 주문</span>
                    <input type="button" id="refreshBtn" value="조회"/>
                </div>

                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>종류</th>
                        <th>가격(P)</th>
                        <th>수량</th>
                        <th>날짜</th>
                        <th>취소</th>
                    </tr>
                    </thead>
                    <tbody id="myOrderListBody">
                    </tbody>
                </table>
            </div>

            <!-- 주문 요청 -->
            <div class="panel">
                <div class="ptitle">주문 요청하기</div>

                <div class="sell-request">
                    <div>가격(P)</div>
                    <input id="sellPrice" type="number" min="100" step="100" value="100"/>

                    <div>수량</div>
                    <input id="sellAmount" type="number" min="1" value="1"/>

                    <div>
                        <button id="sellBtn" class="sell-btn">매도</button>
                    </div>
                </div>

                <div class="buy-request">
                    <div>가격(P)</div>
                    <input id="buyPrice" type="number" min="100" step="100" value="100"/>

                    <div>수량</div>
                    <input id="buyAmount" type="number" min="1" value="1"/>

                    <div>
                        <button id="buyBtn" class="buy-btn">매수</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

<!--    <div th:replace="~{SideBar :: sidebar}"></div>-->
</div>

<script th:src="@{/js/stock-detail.js}" type="text/javascript"></script>

<script th:if="${message != null}" th:inline="javascript">
    alert(/*[[${message}]]*/ '');
</script>

</body>
</html>
