<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>쿠폰 구매 테스트</title>

  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <script th:src="@{/js/coupon-purchase.js}"></script>
</head>

<body>

<header style="display:flex; justify-content:space-between; align-items:center;">
  <h1>쿠폰 구매 테스트</h1>

  <div>
    <span sec:authentication="name">아이디</span>님

    <form method="post" th:action="@{/logout}" style="display:inline;">
      <button type="submit">로그아웃</button>
    </form>
  </div>
</header>

<hr>

<h2>쿠폰 목록</h2>

<table border="1" cellpadding="8" cellspacing="0">
  <thead>
  <tr>
    <th>쿠폰 번호</th>
    <th>쿠폰 이름</th>
    <th>가격</th>
    <th>구매</th>
  </tr>
  </thead>

  <tbody>
  <tr>
    <td>1</td>
    <td>간식 교환권</td>
    <td>500P</td>
    <td>
      <button type="button"
              onclick="buyCoupon(1, '간식 교환권', 500)">
        구매하기
      </button>
    </td>
  </tr>

  <tr>
    <td>2</td>
    <td>청소당번 면제권</td>
    <td>3000P</td>
    <td>
      <button type="button"
              onclick="buyCoupon(2, '청소당번 면제권', 3000)">
        구매하기
      </button>
    </td>
  </tr>

  <tr>
    <td>3</td>
    <td>분리수거 면제권</td>
    <td>1000P</td>
    <td>
      <button type="button"
              onclick="buyCoupon(3, '분리수거 면제권', 1000)">
        구매하기
      </button>
    </td>
  </tr>
  </tbody>
</table>

<hr>

<h3>응답 결과</h3>
<p id="resultMessage">아직 구매 요청 전입니다.</p>

<pre id="jsonResult"></pre>

</body>
</html>
