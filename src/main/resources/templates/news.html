<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오늘의 뉴스</title>

    <meta name="_csrf"        th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/Common.css}">
    <link rel="stylesheet" th:href="@{/css/News.css}">
    <link rel="stylesheet" th:href="@{/css/SideBar.css}">
</head>

<body>
<div class="app">

    <div class="content">

        <header class="hd">
            <div class="hd-name">오늘의 뉴스</div>
        </header>

        <main class="main news-main">

            <section class="news-section">

                <div class="news-grid-container" id="newsGrid">

                    <article class="news-card-item"
                             th:each="news, status : ${newsList}">

                        <div class="card-side-deco"
                             th:classappend="' color-' + (${status.index} % 5)">
                        </div>

                        <div class="news-icon-box">
                            📰
                        </div>

                        <div class="card-body-content">
                            <p class="news-text-main"
                               th:text="${news.getNewsContent()}">
                                뉴스 내용
                            </p>
                        </div>

                    </article>

                    <div class="empty-news-message"
                         th:if="${newsList == null or #lists.isEmpty(newsList)}">

                        <div class="empty-news-icon">📰</div>
                        <p>현재 등록된 새로운 소식이 없습니다.</p>
                        <span>새로운 뉴스가 등록되면 이곳에 표시됩니다.</span>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <div th:replace="~{sideBar :: sidebar('news')}"></div>

</div>

<script th:src="@{/js/news.js}"></script>
</body>
</html>
