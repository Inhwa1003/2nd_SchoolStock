<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오늘의 뉴스</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" type="text/css"
          th:href="@{/css/News.css}">
</head>

<body>
<div class="app">
    <div class="content">

        <header class="hd">
            <div class="hd-name">오늘의 뉴스</div>
        </header>

        <div class="main">
            <div class="news-grid-container" id="newsGrid">

                <div class="news-card-item"
                     th:each="news, status : ${newsList}">

                    <div class="card-side-deco"
                         th:classappend="' color-' + (${status.index} % 5)">
                    </div>

                    <div class="card-body-content">
                        <p class="news-text-main"
                           th:text="${news}">
                            뉴스 내용
                        </p>
                    </div>
                </div>

                <p class="empty-news-message"
                   th:if="${newsList == null or #lists.isEmpty(newsList)}">
                    현재 등록된 새로운 소식이 없습니다.
                </p>

            </div>
        </div>

    </div>
</div>

<script th:src="@{/js/news.js}"></script>
</body>
</html>
