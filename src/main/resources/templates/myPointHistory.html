<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>내 포인트 내역</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Common.css}" />
    <link rel="stylesheet" th:href="@{/css/MyPointHistory.css}" />
</head>
<body>
<div class="app">
    <div class="content">

        <header class="hd">
            <div class="hd-name">내 포인트 내역</div>
        </header>

        <div class="main">
            <div class="panel">
                <table class="history-table">
                    <thead>
                    <tr>
                        <th>날짜</th><th>유형</th><th>내용</th><th>포인트 변화</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(pointHistory)}">
                        <td colspan="4">포인트 내역이 없습니다.</td>
                    </tr>

                    <tr th:each="h : ${pointHistory}">
                        <td class="date" th:text="${#temporals.format(h.historyDate, 'yyyy-MM-dd')}">2026-06-08</td>
                        <td th:text="${h.historyType}">유형</td>
                        <td th:text="${h.historyContent}">내용</td>
                        <td th:classappend="${h.pointChange ge 0} ? 'plus' : 'minus'"
                            th:text="${(h.pointChange ge 0 ? '+' : '') + #numbers.formatInteger(h.pointChange, 1, 'COMMA')} + 'P'">+0P</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>
</body>
</html>
