<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>학생 목록 조회</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/MyStudentList.css}">
</head>

<body>
<div class="page-container">

    <!-- 왼쪽 사이드바 -->
    <aside class="sidebar">
        <div class="sidebar-title">School Stock</div>

        <nav class="sidebar-menu">
            <a th:href="@{/schoolstock/t/me/teachers/my-students}" class="active">학생 목록 조회</a>
            <a href="#">쿠폰 관리</a>
            <a href="#">주식 관리</a>
            <a href="#">뉴스 관리</a>
            <a th:href="@{/logout}">로그아웃</a>
        </nav>
    </aside>

    <!-- 메인 영역 -->
    <main class="main-content">
        <h1 class="page-title">학생 목록 조회</h1>

        <section class="student-list-box">

            <div class="student-list-header">
                <div>번호</div>
                <div>이름</div>
                <div class="point-header">보유 포인트</div>
            </div>

            <!-- 학생 목록이 있을 때 -->
            <div th:if="${studentList != null and !studentList.isEmpty()}">
                <div class="student-item"
                     th:each="student : ${studentList}"
                     th:data-student-number="${student.studentNumber}">

                    <div class="student-number"
                         th:text="${student.studentNumber}">
                        9
                    </div>

                    <div class="student-name"
                         th:text="${student.name}">
                        박소영
                    </div>

                    <div class="student-point">
                        <span th:text="${#numbers.formatInteger(student.totalPoint, 3, 'COMMA')}">
                            5000
                        </span>
                        <span>P</span>
                    </div>
                </div>
            </div>

            <!-- 학생 목록이 없을 때 -->
            <div class="empty-message"
                 th:if="${studentList == null or studentList.isEmpty()}">
                담당 반 학생 정보가 없습니다.
            </div>

        </section>
    </main>

</div>

<script th:src="@{/js/my-student-list.js}"></script>
</body>
</html>
