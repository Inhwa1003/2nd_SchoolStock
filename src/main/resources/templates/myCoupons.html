<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>보유 쿠폰</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf"        th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Common.css}">
    <link rel="stylesheet" th:href="@{/css/MyCoupon.css}">
    <link rel="stylesheet" th:href="@{/css/SideBar.css}">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div class="app">
    <div class="content">
        <header class="hd">
            <input id="backBtn"
                   class="back-btn" type="button"
                   value="← 뒤로">

            <div class="hd-name"
                 th:text="${couponTitle}">
                보유 쿠폰
            </div>
        </header>

        <div class="main cp-grid"
             id="couponContainer"
             th:data-student-number="${targetStudentNumber}">

            <section class="coupon-section">
                <div class="coupon-section-title">
                    <h3>보유 쿠폰</h3>
                    <span class="coupon-count-badge"
                          th:text="${#lists.size(coupons)}">
                        0
                    </span>
                </div>

                <div class="coupon-list">

                    <article class="cp-panel"
                             th:each="c : ${coupons}">
                        <div class="coupon-visual">
                            <div class="coupon-visual-icon">🎟</div>
                        </div>

                        <div class="coupon-info">
                            <div class="cp-name"
                                 th:text="${c.name}">
                                쿠폰명
                            </div>

                            <span class="coupon-state-badge">
                             보유중
                            </span>

                            <div class="coupon-price-area">
                            <span class="coupon-price-label">
                            구매 가격
                            </span>

                            <div class="coupon-price-row">
                            <span class="point-circle">P</span>

                                <div class="cp-price"
                                th:text="${#numbers.formatInteger(c.purchasePoint, 1, 'COMMA')} + 'P'">
                                0P
                                </div>
                            </div>
                    </div>
                </div>

                <div class="coupon-action-area">
                    <th:block sec:authorize="hasRole('TEACHER')">
                    <button type="button"
                    class="use-coupon-btn"
                    th:data-coupon-purchase-no="${c.couponPurchaseNo}">
                    사용 처리
                    </button>
                    </th:block>
                    <span class="coupon-arrow">›</span>
                </div>
                </article>

                </div>

                <div class="empty-coupon-state"
                     th:if="${#lists.isEmpty(coupons)}">
                    <div class="empty-coupon-icon">🎟</div>
                    <p>보유 쿠폰이 없습니다.</p>
                    <span>쿠폰 상점에서 필요한 쿠폰을 구매해보세요.</span>
                </div>
            </section>
        </div>
    </div>
    <div th:replace="~{sideBar :: sidebar('')}"></div>
</div>
<script th:src="@{/js/my-coupons.js}"></script>
</body>
</html>
