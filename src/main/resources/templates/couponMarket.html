<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>쿠폰 구매 테스트</title>

  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <script th:src="@{/js/coupon-market.js}"></script>
</head>

<body>

<header style="display:flex; justify-content:space-between; align-items:center;">
  <h1>쿠폰 상점 및 구매 테스트</h1>

  <div>
    <span sec:authentication="name">아이디</span>님

    <form method="post" th:action="@{/logout}" style="display:inline;">
      <button type="submit">로그아웃</button>
    </form>
  </div>
</header>

<hr>

<h2>쿠폰 목록</h2>

<table border="1" cellpadding="8" cellspacing="0">
  <thead>
  <tr>
    <th>쿠폰 번호</th>
    <th>쿠폰 이름</th>
    <th>가격</th>
    <th>구매</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="coupon : ${couponList}">
    <td th:text="${coupon.couponNo}">쿠폰 번호</td>
    <td th:text="${coupon.name}">쿠폰 이름</td>
    <td th:text="${coupon.couponPoint + 'P'}">가격</td>
    <td>
      <button type="button"
              th:data-coupon-no="${coupon.couponNo}"
              th:data-coupon-name="${coupon.name}"
              th:data-coupon-point="${coupon.couponPoint}"
              onclick="buyCouponFromButton(this)">
        구매하기
      </button>
    </td>
  </tr>
  </tbody>
</table>

<hr>

<h3>응답 결과</h3>
<p id="resultMessage">아직 구매 요청 전입니다.</p>

<pre id="jsonResult"></pre>

</body>
</html>
