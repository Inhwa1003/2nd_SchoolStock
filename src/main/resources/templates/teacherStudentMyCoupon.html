<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>학생 보유 쿠폰</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/Common.css}">
    <link rel="stylesheet" th:href="@{/css/SideBar.css}">
    <link rel="stylesheet" th:href="@{/css/MyCoupon.css}">
</head>

<body>

<div class="layout">

    <!-- 사이드바 -->
    <aside class="sidebar">
        <div class="sidebar-title">SchoolStock</div>

        <ul class="sidebar-menu">
            <li>
                <a th:href="@{/schoolstock/t/me/teachers/my-students}">
                    학생 목록
                </a>
            </li>
            <li>
                <a th:href="@{/schoolstock/t/coupons}">
                    쿠폰 상점 관리
                </a>
            </li>
        </ul>
    </aside>

    <!-- 메인 영역 -->
    <main class="content">

        <div class="page-header">
            <button type="button" id="backBtn" class="btn btn-secondary btn-sm">
                뒤로가기
            </button>

            <h2 class="page-title">
                <span th:text="${studentName}">학생 이름</span> 보유 쿠폰
            </h2>
        </div>

        <div class="main cp-grid"
             id="couponContainer"
             th:data-student-number="${studentNumber}">

            <!-- 쿠폰 목록 -->
            <div class="cp-panel" th:each="coupon : ${couponList}">

                <div class="cp-name" th:text="${coupon.name}">
                    쿠폰명
                </div>

                <div class="cp-point">
                    <span th:text="${coupon.purchasePoint}">0</span> P
                </div>

                <div class="cp-state" th:text="${coupon.purchaseState}">
                    NOT_USED
                </div>

                <button type="button"
                        class="btn btn-sm btn-danger mt-2 use-coupon-btn"
                        th:data-coupon-purchase-no="${coupon.couponPurchaseNo}">
                    삭제
                </button>

            </div>

            <!-- 보유 쿠폰 없을 때 -->
            <div class="text-center w-100"
                 th:if="${#lists.isEmpty(couponList)}">
                보유 쿠폰이 없습니다.
            </div>

        </div>

    </main>

</div>

<script th:src="@{/js/teacher-student-my-coupon.js}"></script>

</body>
</html>
