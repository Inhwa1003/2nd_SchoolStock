<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>보유 쿠폰</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Common.css}">
    <link rel="stylesheet" th:href="@{/css/StockDetail.css}">
    <link rel="stylesheet" th:href="@{/css/SideBar.css}">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="app">
    <div class="content">
        <header class="hd">
            <input id="backBtn" class="back-btn" type="button" value="뒤로">
            <div class="hd-name" th:text="${studentName} + '의 보유 쿠폰'">학생의 보유 쿠폰</div>
        </header>

        <div class="main cp-grid">
            <div class="cp-panel" th:each="coupon : ${couponList}">
                <div class="cp-name" th:text="${coupon.name}">쿠폰명</div>
                <div class="cp-state" th:text="${coupon.purchaseState}">NOT_USED</div>

                <button type="button" class="btn btn-sm btn-primary mt-2">
                    사용
                </button>
            </div>

            <div class="text-center" th:if="${#lists.isEmpty(couponList)}">
                보유 쿠폰이 없습니다.
            </div>
        </div>
    </div>

    <div th:replace="~{sideBar :: sidebar('')}"></div>
</div>

<script th:src="@{/js/my-coupons.js}"></script>
</body>
</html>
